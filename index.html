<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Chiang Mai & Bangkok Map Game</title>

<style>
body {
  margin: 0;
  overflow: hidden;
}

#gameContainer {
  width: 100vw;
  height: 100vh;
  background: url("img/ocean.png") no-repeat center center;
  background-size: cover;
  position: relative;
  overflow: hidden;
}

/* 主地圖 */
#mainMap {
  position: absolute;
  width: 90vw;
  height: calc(90vw * 1492 / 765);
  max-height: 85vh;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -55%);
  background-size: contain;
  background-repeat: no-repeat;
  z-index: 2;
}

/* 小地圖 */
#miniMap {
  position: absolute;
  width: 120px;
  height: 120px;
  background-size: cover;
  z-index: 3;
  border-radius: 10px;
}

/* 人物 */
#hero {
  width: 60px;
  height: 60px;
  background: url("img/hero.png") center/contain no-repeat;
  position: absolute;
  z-index: 4;
  top: 50%;
  left: 50%;
}

/* 景點：夜市 + 寺廟 + 可增加其他 */
.poi {
  width: 80px;
  height: 80px;
  background-size: contain;
  background-repeat: no-repeat;
  position: absolute;
  z-index: 5;
}
.hidden { display: none; }

/* 手機方向鍵容器 */
#controls {
  position: absolute;
  bottom: 20px;
  width: 200px;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  z-index: 10;
}

/* 方向鍵 */
.btn {
  width: 60px;
  height: 60px;
  font-size: 26px;
  border-radius: 50%;
  border: none;
  background: transparent;   /* 無白色底 */
}

.btn:active { background: #ffd; }

/* 方向鍵位置 */
#btnUp { top: -20px; left: 80px; position: absolute; }
#btnDown { top: 60px; left: 80px; position: absolute; }
#btnLeft { top: 20px; left: 40px; position: absolute; }
#btnRight { top: 20px; left: 120px; position: absolute; }
#btnEnter { top: 20px; left: 80px; position: absolute; }
</style>
</head>

<body>

<div id="gameContainer">

  <!-- 主地圖 -->
  <div id="mainMap"></div>

  <!-- 小地圖 -->
  <div id="miniMap"></div>

  <!-- 人物 -->
  <div id="hero"></div>

  <!-- 景點 -->
  <div id="nightmarket" class="poi" style="left: 180px; top: 260px; background-image:url('img/nightmarket.png');"></div>
  <div id="watChediLuang" class="poi" style="left: 300px; top: 420px; background-image:url('img/temple.png');"></div>

  <!-- 可擴充：貓景點 / 咖啡 / 酒吧 / 美食 -->
  <div id="catspot" class="poi hidden" style="background-image:url('img/cat.png'); left:250px; top:350px;"></div>
  <div id="cafe" class="poi hidden" style="background-image:url('img/cafe.png'); left:200px; top:430px;"></div>
  <div id="bar" class="poi hidden" style="background-image:url('img/bar.png'); left:340px; top:310px;"></div>
  <div id="food" class="poi hidden" style="background-image:url('img/food.png'); left:260px; top:500px;"></div>

  <!-- 手機方向鍵 -->
  <div id="controls">
    <button class="btn" id="btnUp">▲</button>
    <button class="btn" id="btnLeft">◀</button>
    <button class="btn" id="btnEnter">●</button>
    <button class="btn" id="btnRight">▶</button>
    <button class="btn" id="btnDown">▼</button>
  </div>

</div>

<script>
// ========= 地圖資料 =========
const maps = {
  chiangMai: {
    main: "img/chiangmai.png",
    mini: "img/bangkok.png"
  },
  bangkok: {
    main: "img/bangkok.png",
    mini: "img/chiangmai.png"
  }
};

// ========= DOM =========
const mainMap = document.getElementById("mainMap");
const miniMap = document.getElementById("miniMap");
const hero = document.getElementById("hero");

const nightmarket = document.getElementById("nightmarket");
const watChediLuang = document.getElementById("watChediLuang");

const catspot = document.getElementById("catspot");
const cafe = document.getElementById("cafe");
const bar = document.getElementById("bar");
const food = document.getElementById("food");

let currentMap = "chiangMai";
let heroPos = { x: 300, y: 300 };

// ========= 更新地圖（主圖 + 小圖 + 景點顯示） =========
function updateMaps(){
  mainMap.style.backgroundImage = `url('${maps[currentMap].main}')`;
  miniMap.style.backgroundImage = `url('${maps[currentMap].mini}')`;

  // 小地圖位置切換
  if(currentMap === "chiangMai"){
    miniMap.style.top = "auto";
    miniMap.style.bottom = "20px";
    miniMap.style.right = "20px";
  } else {
    miniMap.style.top = "20px";
    miniMap.style.bottom = "auto";
    miniMap.style.right = "20px";
  }

  // 景點顯示控制
  if(currentMap === "chiangMai"){
    nightmarket.style.display = "block";
    watChediLuang.style.display = "block";
    catspot.style.display = "block";
    cafe.style.display = "block";
    bar.style.display = "block";
    food.style.display = "block";
  } else {
    nightmarket.style.display = "none";
    watChediLuang.style.display = "none";
    catspot.style.display = "none";
    cafe.style.display = "none";
    bar.style.display = "none";
    food.style.display = "none";
  }
}

updateMaps();

// ========= 角色移動 =========
function moveHero(dx, dy){
  const container = document.getElementById("gameContainer");
  const rect = container.getBoundingClientRect();

  heroPos.x = Math.max(0, Math.min(rect.width - 60, heroPos.x + dx));
  heroPos.y = Math.max(0, Math.min(rect.height - 60, heroPos.y + dy));

  hero.style.left = heroPos.x + "px";
  hero.style.top = heroPos.y + "px";

  checkMapSwitch();
}

// ========= 切換地圖 =========
function checkMapSwitch(){
  if(currentMap === "chiangMai" && heroPos.y < 10){
    currentMap = "bangkok";
    updateMaps();
    heroPos.y = window.innerHeight - 100;
  }
  else if(currentMap === "bangkok" && heroPos.y > window.innerHeight - 80){
    currentMap = "chiangMai";
    updateMaps();
    heroPos.y = 50;
  }
  hero.style.top = heroPos.y + "px";
}

// ========= 手機按鈕 =========
document.getElementById("btnUp").onclick = ()=> moveHero(0, -20);
document.getElementById("btnDown").onclick = ()=> moveHero(0, +20);
document.getElementById("btnLeft").onclick = ()=> moveHero(-20, 0);
document.getElementById("btnRight").onclick = ()=> moveHero(+20, 0);
document.getElementById("btnEnter").onclick = ()=> alert("ENTER!");
</script>

</body>
</html>
