<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>清邁&曼谷WEDDING TRIP</title>

<style>
/* -------- 基本 -------- */
html,body{width:100%;height:100%;margin:0;padding:0;}
body{
  margin:0;
  font-family:"Microsoft JhengHei",sans-serif;
  background:#5982CB;
  overflow:hidden;
}

/* -------- 容器 & 背景 -------- */
#gameContainer{
  position:relative;
  width:100vw;
  height:100vh;
  background:url('img/ocean.png') no-repeat center center;
  background-size:cover;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
  z-index:0;
}

/* -------- 主地圖 -------- */
#mainMap{
  position:absolute;
  top: calc(env(safe-area-inset-top) + 4%);
  left:50%;
  transform:translateX(-50%);
  width:92vw;
  height:calc(92vw * 1492 / 765); /* 保持原比例 */
  max-height:80vh;
  background-size:contain;
  background-repeat:no-repeat;
  background-position:center;
  z-index:1;
  /* 若需要預設圖可放在 CSS，但我們以 JS 設定為主 */
}

/* -------- 小地圖（有外框） -------- */
#miniMap{
  position:absolute;
  width:120px;
  height:120px;
  background-size:contain;
  background-repeat:no-repeat;
  background-position:center;
  z-index:30; /* 蓋在主地圖上 */
  border:4px solid rgba(255,255,255,0.95);
  border-radius:16px;
  box-shadow:0 6px 18px rgba(0,0,0,0.25);
}

/* -------- 主角 -------- */
#hero{
  position:absolute;
  width:60px;
  height:60px;
  background:url('img/us.png') no-repeat center/cover;
  z-index:40;
}

/* -------- 景點圖示 -------- */
.house, .house1{
  position:absolute;
  width:65px;
  height:65px;
  border-radius:10px;
  overflow:hidden;
  cursor:pointer;
  z-index:35;
}
.house1{ width:60px; height:60px; }
.house img, .house1 img{ width:100%; height:100%; object-fit:cover; }

/* -------- 手機控制（方向鍵） -------- */
#controls{
  position:fixed;
  right:6%;
  bottom: calc(env(safe-area-inset-bottom) + 30px); /* 整體往下 */
  width:220px;
  height:180px;
  z-index:60;
  pointer-events:none; /* 讓內部圖片可控制 pointer-events */
  display:none; /* 僅在窄螢幕顯示 */
}

/* 按鈕 */
.btn{ pointer-events:auto; position:absolute; width:60px; height:60px; background:transparent; border-radius:0; box-shadow:none; text-align:center; line-height:60px; }
.btnImg{ width:40px; height:40px; object-fit:contain; pointer-events:none; }

/* 調整按鈕相對位置（更接近、整組下移） */
#btnUp { top: 4px; left: 80px; }
#btnDown { top: 104px; left: 80px; }
#btnLeft { top: 54px; left: 30px; }
#btnRight { top: 54px; left: 130px; }
#btnEnter { top: 54px; left: 80px; background:transparent; }

/* 手機呈現 */
@media (max-width:799px){
  #controls { display:block; }
  /* 在小螢幕把 mainMap 寬度稍微縮一點以留安全區 */
  #mainMap{ width:90vw; height:calc(90vw * 1492 / 765); max-height:78vh; top: calc(env(safe-area-inset-top) + 6%); }
  /* 適度放大 hero 在手機上 */
  #hero{ width:56px; height:56px; }
}

/* 小螢幕額外微調 (iPhone 15/16 常見寬度) */
@media (max-width:430px){
  #controls{ right:5%; bottom: calc(env(safe-area-inset-bottom) + 26px); }
  #btnLeft { left: 26px; } 
  #btnRight { left: 134px; }
}
</style>
</head>
<body>
<div id="gameContainer">
  <div id="mainMap"></div>
  <div id="miniMap"></div>
  <div id="hero"></div>

  <!-- CM 景點 -->
  <div class="house" id="nightmarket" style="left:20%; top:70%;"><img src="img/nightmarket.png" alt="nightmarket"></div>
  <div class="house" id="temple" style="left:62%; top:15%;"><img src="img/temple.png" alt="temple"></div>
  <div class="house" id="catspot" style="left:57%; top:28%;"><img src="img/catspot.png" alt="catspot"></div>
  <div class="house" id="cafe" style="left:37%; top:53%;"><img src="img/cafe.png" alt="cafe"></div>
  <div class="house" id="bar" style="left:35%; top:35%;"><img src="img/bar.png" alt="bar"></div>
  <div class="house" id="food" style="left:45%; top:22%;"><img src="img/food.png" alt="food"></div>
  <div class="house1" id="youme" style="left:22%; top:45%;"><img src="img/youme.png" alt="youme"></div>
  <div class="house" id="townwalk" style="left:20%; top:60%;"><img src="img/townwalk.png" alt="townwalk"></div>

  <!-- 手機控制 -->
  <div id="controls">
    <div id="btnUp" class="btn"><img src="img/up.png" class="btnImg" alt="up"></div>
    <div id="btnLeft" class="btn"><img src="img/left.png" class="btnImg" alt="left"></div>
    <div id="btnEnter" class="btn">GO</div>
    <div id="btnRight" class="btn"><img src="img/right.png" class="btnImg" alt="right"></div>
    <div id="btnDown" class="btn"><img src="img/down.png" class="btnImg" alt="down"></div>
  </div>
</div>

<script>
// 元件
const hero = document.getElementById('hero');
const container = document.getElementById('gameContainer');
const mainMap = document.getElementById('mainMap');
const miniMap = document.getElementById('miniMap');

const nightmarket = document.getElementById('nightmarket');
const temple = document.getElementById('temple');
const catspot = document.getElementById('catspot');
const cafe = document.getElementById('cafe');
const bar = document.getElementById('bar');
const food = document.getElementById('food');
const youme = document.getElementById('youme');
const townwalk = document.getElementById('townwalk');

const isMobile = window.innerWidth < 800;

// 初始狀態
let heroPos = { x: 100, y: 200 };
let step = 6;
let currentMap = 'chiangMai'; // chiangMai / bangkok

// 地圖資源
const maps = {
  chiangMai: { main: 'img/chiangmai.png', mini: 'img/bangkok.png' }, // 主：CM，小：BKK
  bangkok:  { main: 'img/bangkok.png', mini: 'img/chiangmai.png' }  // 主：BKK，小：CM
};

// 把按鈕 touch 綁上（若在 mobile）
if(isMobile){
  document.querySelectorAll('.btn').forEach(btn=>{
    btn.addEventListener('touchstart', e=>{
      e.preventDefault();
      const id = btn.id;
      if(id === 'btnEnter') keys['Enter'] = true;
      else if(id === 'btnUp') keys['ArrowUp'] = true;
      else if(id === 'btnDown') keys['ArrowDown'] = true;
      else if(id === 'btnLeft') keys['ArrowLeft'] = true;
      else if(id === 'btnRight') keys['ArrowRight'] = true;
    });
    btn.addEventListener('touchend', e=>{
      e.preventDefault();
      const id = btn.id;
      if(id === 'btnEnter') keys['Enter'] = false;
      else if(id === 'btnUp') keys['ArrowUp'] = false;
      else if(id === 'btnDown') keys['ArrowDown'] = false;
      else if(id === 'btnLeft') keys['ArrowLeft'] = false;
      else if(id === 'btnRight') keys['ArrowRight'] = false;
    });
  });
}

// 更新 hero 位置到 DOM
function updateHero(){ hero.style.left = heroPos.x + 'px'; hero.style.top = heroPos.y + 'px'; }
updateHero();

// collision helper（以 container 為坐標原點）
function overlap(pos, el){
  const containerRect = container.getBoundingClientRect();
  const rect = el.getBoundingClientRect();

  const elX = rect.left - containerRect.left;
  const elY = rect.top - containerRect.top;

  return !( pos.x + hero.offsetWidth < elX ||
            pos.x > elX + rect.width ||
            pos.y + hero.offsetHeight < elY ||
            pos.y > elY + rect.height );
}

// updateMaps：設定 mainMap / miniMap 背景並調整 miniMap 位置（上/下）
function updateMaps(){
  // 設定圖
  mainMap.style.backgroundImage = `url('${maps[currentMap].main}')`;
  miniMap.style.backgroundImage = `url('${maps[currentMap].mini}')`;

  // miniMap 預設大小
  miniMap.style.width = '120px';
  miniMap.style.height = '120px';

  // 當在清邁主地圖時（mini 顯示曼谷）→ 把小地圖往上（更靠近 top）
  if(currentMap === 'chiangMai'){
    miniMap.style.top = '8%';      /* 曼谷小地圖往上 */
    miniMap.style.bottom = 'auto';
    miniMap.style.right = '5%';
  } else {
    // 在曼谷主地圖時（mini 顯示清邁）→ 把小地圖往下
    miniMap.style.top = 'auto';
    miniMap.style.bottom = '6%';   /* 清邁小地圖往下 */
    miniMap.style.right = '5%';
  }

  // 顯示 / 隱藏清邁景點（只在清邁主地圖顯示）
  const showCM = (currentMap === 'chiangMai');
  [nightmarket, temple, catspot, cafe, bar, food, youme, townwalk].forEach(el=>{
    if(!el) return;
    el.style.display = showCM ? 'block' : 'none';
  });
}

// 初始化地圖
updateMaps();

// 鍵盤控制
const keys = {};
document.addEventListener('keydown', e=> keys[e.key] = true);
document.addEventListener('keyup', e=> keys[e.key] = false);

// 遊戲主 loop
function gameLoop(){
  let dx = 0, dy = 0;
  if(keys['ArrowUp'] || keys['up']) dy -= step;
  if(keys['ArrowDown'] || keys['down']) dy += step;
  if(keys['ArrowLeft'] || keys['left']) dx -= step;
  if(keys['ArrowRight'] || keys['right']) dx += step;

  const containerRect = container.getBoundingClientRect();
  heroPos.x = Math.max(0, Math.min(containerRect.width - hero.offsetWidth, heroPos.x + dx));
  heroPos.y = Math.max(0, Math.min(containerRect.height - hero.offsetHeight, heroPos.y + dy));
  updateHero();

  // 碰到小地圖 → 切換地圖
  if(overlap(heroPos, miniMap)){
    currentMap = (currentMap === 'chiangMai') ? 'bangkok' : 'chiangMai';
    updateMaps();
  }

  // 相簿進入（按 Enter / GO）
  if(currentMap === 'chiangMai' && keys['Enter']){
    if(overlap(heroPos, nightmarket)) location.href = 'NIGHT MARKET in CM.html';
    else if(overlap(heroPos, temple)) location.href = 'TEMPLE in CM.html';
    else if(overlap(heroPos, catspot)) location.href = 'CATSPOT in CM.html';
    else if(overlap(heroPos, cafe)) location.href = 'CAFE in CM.html';
    else if(overlap(heroPos, bar)) location.href = 'BAR in CM.html';
    else if(overlap(heroPos, food)) location.href = 'FOOD in CM.html';
    else if(overlap(heroPos, youme)) location.href = 'YOUME in CM.html';
    else if(overlap(heroPos, townwalk)) location.href = 'TOWNWALK in CM.html';
  }

  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
